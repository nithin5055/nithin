
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fitness Coach Developed by NITHIN VV</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101522;
      color: white;
      text-align: center;
    }

    header { padding: 22px 12px; }

    h1 { margin: 0; color: #55f5a3; }

    .container {
      width: min(950px, 95%);
      margin: auto;
    }

    .camera {
      position: relative;
      width: 100%;
      background: #080b12;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      object-fit: contain;
    }

    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }

    .panel {
      margin: 16px 0;
      padding: 20px;
      background: #1c2435;
      border-radius: 14px;
    }

    .feedback {
      font-size: 24px;
      font-weight: bold;
      color: #ffd166;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat { min-width: 100px; }

    .number {
      font-size: 32px;
      color: #55f5a3;
      font-weight: bold;
    }

    button, select {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      margin: 6px;
      font-size: 16px;
    }

    button {
      background: #55f5a3;
      color: #101522;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }

    #stop { background: #ff6877; }

    .hint { color: #bdc7da; font-size: 14px; }
  </style>
</head>

<body>
  <header>
    <h1>AI Fitness Coach</h1>
    <p>Real-time body tracking and exercise feedback</p>
  </header>

  <main class="container">
    <div class="camera">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div>
      <select id="exercise">
        <option value="squat">Squats</option>
      </select>
      <button id="start">Start Camera</button>
      <button id="stop" disabled>Stop Camera</button>
    </div>

    <div class="panel">
      <div id="feedback" class="feedback">Click Start Camera</div>
      <p id="detail" class="hint">
        Stand where your full body is visible.
      </p>
    </div>

    <div class="panel stats">
      <div class="stat">
        <div class="number" id="reps">0</div>
        <div>Repetitions</div>
      </div>
      <div class="stat">
        <div class="number" id="angle">--</div>
        <div>Knee Angle</div>
      </div>
      <div class="stat">
        <div class="number" id="status">--</div>
        <div>Form Status</div>
      </div>
    </div>

    <p class="hint">
      Use a side-facing camera angle for better squat analysis.
      This is an educational prototype, not a medical assessment.
    </p>
  </main>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const startBtn = document.getElementById("start");
    const stopBtn = document.getElementById("stop");
    const feedback = document.getElementById("feedback");
    const detail = document.getElementById("detail");
    const repsText = document.getElementById("reps");
    const angleText = document.getElementById("angle");
    const statusText = document.getElementById("status");

    let poseLandmarker;
    let stream;
    let running = false;
    let lastVideoTime = -1;
    let reps = 0;
    let phase = "up";
    let badFrames = 0;

    // Landmark indices:
    // 11/12 shoulders, 23/24 hips,
    // 25/26 knees, 27/28 ankles.

    function angleBetween(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x)
                    - Math.atan2(a.y - b.y, a.x - b.x);

      let degrees = Math.abs(radians * 180 / Math.PI);
      if (degrees > 180) degrees = 360 - degrees;
      return degrees;
    }

    function drawPose(landmarks) {
      const connections = [
        [11,12], [11,23], [12,24], [23,24],
        [11,13], [13,15], [12,14], [14,16],
        [23,25], [25,27], [24,26], [26,28]
      ];

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 4;
      ctx.strokeStyle = "#55f5a3";
      ctx.fillStyle = "#ffffff";

      function point(i) {
        // Mirror coordinates to match the mirrored video.
        return {
          x: (1 - landmarks[i].x) * canvas.width,
          y: landmarks[i].y * canvas.height
        };
      }

      for (const [a, b] of connections) {
        if (landmarks[a].visibility < 0.5 ||
            landmarks[b].visibility < 0.5) continue;

        const p1 = point(a);
        const p2 = point(b);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      for (let i = 11; i <= 28; i++) {
        if (landmarks[i].visibility < 0.5) continue;

        const p = point(i);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function showFeedback(message, description, good = false) {
      feedback.textContent = message;
      feedback.style.color = good ? "#55f5a3" : "#ffd166";
      detail.textContent = description;
    }

    function analyzePose(landmarks) {
      const required = [11, 12, 23, 24, 25, 26, 27, 28];

      if (required.some(i => landmarks[i].visibility < 0.55)) {
        showFeedback(
          "Body not fully visible",
          "Move back and keep your shoulders, hips, knees and ankles in view."
        );
        statusText.textContent = "--";
        return;
      }

      // Analyze the more visible leg.
      const leftVisibility = Math.min(
        landmarks[23].visibility,
        landmarks[25].visibility,
        landmarks[27].visibility
      );

      const rightVisibility = Math.min(
        landmarks[24].visibility,
        landmarks[26].visibility,
        landmarks[28].visibility
      );

      const ids = leftVisibility >= rightVisibility
        ? [23, 25, 27, 11]
        : [24, 26, 28, 12];

      const [hip, knee, ankle, shoulder] = ids.map(i => landmarks[i]);

      const kneeAngle = angleBetween(hip, knee, ankle);
      angleText.textContent = Math.round(kneeAngle) + "°";

      // A rough back-alignment indicator, not a clinical measurement.
      const torsoAngle = Math.abs(
        Math.atan2(shoulder.x - hip.x, hip.y - shoulder.y)
        * 180 / Math.PI
      );

      // Track squat phases using knee angle.
      if (kneeAngle > 155) {
        if (phase === "down") {
          phase = "up";
          reps++;
          repsText.textContent = reps;
        }
      } else if (kneeAngle < 110) {
        phase = "down";
      }

      if (kneeAngle < 155 && torsoAngle > 55) {
        badFrames++;
      } else {
        badFrames = Math.max(0, badFrames - 1);
      }

      if (badFrames > 8) {
        showFeedback(
          "Check your torso",
          "Try keeping your chest lifted and your spine neutral."
        );
        statusText.textContent = "CHECK";
      } else if (phase === "down" && kneeAngle > 125) {
        showFeedback(
          "Go a little lower",
          "Bend your knees and hips further, only as far as comfortable."
        );
        statusText.textContent = "CHECK";
      } else if (phase === "down") {
        showFeedback(
          "Good depth!",
          "Keep your balance and push through your feet to stand.",
          true
        );
        statusText.textContent = "GOOD";
      } else {
        showFeedback(
          "Standing position",
          "Begin your squat slowly. Keep your feet stable.",
          true
        );
        statusText.textContent = "READY";
      }
    }

    async function loadModel() {
      feedback.textContent = "Loading pose detection...";
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      });
    }

    function loop() {
      if (!running) return;

      if (video.readyState >= 2 &&
          video.currentTime !== lastVideoTime &&
          poseLandmarker) {
        lastVideoTime = video.currentTime;

        const result = poseLandmarker.detectForVideo(
          video,
          performance.now()
        );

        if (result.landmarks && result.landmarks.length) {
          const landmarks = result.landmarks[0];
          drawPose(landmarks);
          analyzePose(landmarks);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          showFeedback(
            "No person detected",
            "Face the camera and make sure your body is visible."
          );
          statusText.textContent = "--";
        }
      }

      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;

      try {
        if (!poseLandmarker) await loadModel();

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        showFeedback("Camera active", "Stand sideways to the camera.");
        loop();
      } catch (error) {
        console.error(error);
        showFeedback(
          "Could not start camera",
          "Allow camera permission and use localhost or HTTPS. Check your internet connection and try again."
        );
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", () => {
      running = false;

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      startBtn.disabled = false;
      stopBtn.disabled = true;
      showFeedback("Camera stopped", "Click Start Camera to begin again.");
      statusText.textContent = "--";
      angleText.textContent = "--";
    });
  </script>
</body>
</html>
